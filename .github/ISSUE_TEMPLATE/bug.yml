name: Bug
description: Report a reproducible product or tooling defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: input
    id: base
    attributes:
      label: Commit / version
      placeholder: exact SHA, tag, or UNKNOWN
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Remove secrets.
    validations:
      required: true
